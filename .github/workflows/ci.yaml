name: CI

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

jobs:
  ci:
    uses: danielriddell21/github-actions/.github/workflows/ci.yaml@v2
    # Read is enough now. The tag job checks out and pushes with tag-token, so
    # the workflow token no longer needs to write anything here.
    permissions:
      contents: read
    with:
      vet: true
      # Both modules: the core, and the templ renderer that lives in its own
      # module so importing the core never pulls a web dependency in.
      test-command: go test -coverprofile=coverage.txt ./... ./web/...
      build-command: go build ./... ./web/...
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      tag-token: ${{ secrets.MERKELBROT_TOKEN }}

  # The viewer is JavaScript, so no Go test ever runs it. This opens the exported
  # page in a real browser and drives it through the zoom range it exists for.
  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/internal/viewertest/package-lock.json
      # The lock file pins every package and nothing runs at install time.
      - run: npm ci --ignore-scripts
        working-directory: web/internal/viewertest
      # The playwright the lock file installed, rather than whatever npx finds.
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: web/internal/viewertest
      - run: node smoke.mjs
        working-directory: web/internal/viewertest

  # The shared workflow already holds the core to a mutation-testing threshold,
  # but it runs at the repository root and the renderer is a module of its own,
  # so nothing there ever reaches it.
  mutation:
    name: Mutation (renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: danielriddell21/gremlins-action@v1
        with:
          version: v0.6.0
          workdir: web
          workers: 2
          memory-mb: 6144

name: ci

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Build
        run: go build ./... ./web/...
      - name: Test
        run: go test -race ./... ./web/...
      - name: Check templ output is current
        run: |
          go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
          git diff --exit-code -- '*_templ.go'
        working-directory: web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      # golangci-lint is built from source rather than downloaded: the published
      # binaries are compiled with an older Go and refuse a module targeting a
      # newer language version.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
        env:
          GOWORK: "off"
      - name: Lint
        run: golangci-lint run ./... ./web/...
